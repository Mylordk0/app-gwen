    <rect x="58" y="0" width="50" height="160" rx="8" fill="#e2e8f0" opacity="0.9"/>
    <rect x="116" y="0" width="50" height="160" rx="8" fill="#e2e8f0" opacity="0.9"/>
    <rect x="174" y="0" width="50" height="160" rx="8" fill="#e2e8f0" opacity="0.9"/>
    <rect x="232" y="0" width="50" height="160" rx="8" fill="#e2e8f0" opacity="0.9"/>
    <rect x="290" y="0" width="50" height="160" rx="8" fill="#e2e8f0" opacity="0.9"/>
    <rect x="35" y="0" width="38" height="100" rx="6" fill="#1e293b"/>
